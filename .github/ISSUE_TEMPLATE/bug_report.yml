name: Bug report
description: Report a reproducible issue without personal or confidential data
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include physician profiles, patient data, credentials, or internal company materials."
  - type: textarea
    id: description
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps using empty or non-personal inputs
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and host environment
  - type: textarea
    id: logs
    attributes:
      label: Redacted error output
